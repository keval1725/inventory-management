# @format

name: Build and Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Inventory.sln

      - name: Build
        run: dotnet build Inventory.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Inventory.sln --configuration Release --no-build
