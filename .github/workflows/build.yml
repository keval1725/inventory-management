# @format

name: Build and Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Inventory.sln

      - name: Build
        run: dotnet build Inventory.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Inventory.sln --configuration Release --no-build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -f src/backend/Inventory.API/Dockerfile \
            -t kevalkadivar/inventory-api:latest \
            -t kevalkadivar/inventory-api:${{ github.sha }} \
            .
      - name: Push Docker Image
        run: |
          docker push kevalkadivar/inventory-api:latest
          docker push kevalkadivar/inventory-api:${{ github.sha }}
