server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin reverse proxy to the api service — this is why the Docker
    # build config uses a relative API_BASE_URL and needs no CORS.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
